<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Kartvizit</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* iOS Renk Paleti ve Değişkenler */
        :root { 
            --bg: #050507; 
            --card-bg: rgba(30, 30, 35, 0.45); 
            --gold: #d4af37; 
            --text: #f5f5f7; 
            --muted: #86868b; 
        }
        
        /* Apple Sistem Fontları */
        body { 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; justify-content: center; min-height: 100vh; 
            background-image: 
                radial-gradient(circle at 10% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 100%, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Dış boşluklar daraltıldı */
        .container { width: 100%; max-width: 480px; padding: 25px 20px; box-sizing: border-box; text-align: center; position: relative; z-index: 1; }
        
        h1 { font-size: 22px; margin: 5px 0 5px; font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        p.sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; font-weight: 500; }
        
        /* iOS WIDGET KARTI (Daha Kompakt) */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px); 
            padding: 18px; 
            border-radius: 20px; 
            margin-bottom: 20px; 
            text-align: left; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .card h2 { color: var(--gold); font-size: 13px; margin-top: 0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700;}
        
        /* Gömülü Bilgi Kutuları (Daraltıldı) */
        .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; margin-left: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .val { 
            background: rgba(0, 0, 0, 0.25); 
            padding: 10px 14px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600; 
            margin-bottom: 12px; 
            word-break: break-all; 
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        #iban-no { font-family: monospace; font-size: 15px; letter-spacing: 1px; color: var(--gold); }
        
        /* Yeni İsim Kopyalama İkonu Stili */
        .inline-copy-icon {
            color: var(--gold);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            transition: all 0.2s;
        }
        .inline-copy-icon:active { transform: scale(0.8); }

        /* Ana Aksiyon Butonu (Daha ince) */
        .btn-copy { 
            background: linear-gradient(135deg, #d4af37, #b5952f); 
            color: #000; border: none; padding: 14px; width: 100%; 
            border-radius: 14px; font-weight: 700; font-size: 15px; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; 
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
        }
        .btn-copy:active { transform: scale(0.96); }
        
        /* YENİ NESİL RENKLİ CAM BUTONLAR (Daha ince ve sıkı) */
        .social-btn { 
            display: flex; align-items: center; justify-content: center; text-decoration: none; 
            padding: 14px; border-radius: 14px; margin-bottom: 10px; font-size: 15px; font-weight: 600; 
            box-sizing: border-box; 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .social-btn:active { transform: scale(0.96); }
        .social-btn i { font-size: 20px; margin-right: 10px; }
        
        /* Özel Marka Cam Renkleri */
        .btn-web { background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.25); color: #fff; }
        .btn-web i { color: var(--gold); }
        
        .btn-google { background: rgba(66, 133, 244, 0.1); border: 1px solid rgba(66, 133, 244, 0.25); color: #fff; }
        .btn-google i { color: #4285F4; }
        
        .btn-wp { background: rgba(37, 211, 102, 0.1); border: 1px solid rgba(37, 211, 102, 0.25); color: #fff; }
        .btn-wp i { color: #34d363; }
        
        .btn-ig { background: rgba(220, 39, 67, 0.1); border: 1px solid rgba(220, 39, 67, 0.25); color: #fff; }
        .btn-ig i { background: -webkit-linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-mail { background: rgba(234, 67, 53, 0.1); border: 1px solid rgba(234, 67, 53, 0.25); color: #fff; }
        .btn-mail i { color: #ea4335; }
        
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #content { display: none; }

        .footer { margin-top: 20px; text-align: center; font-size: 13px; color: var(--muted); padding-bottom: 15px; line-height: 1.8; }
        .footer a { color: var(--gold); text-decoration: none; font-weight: 600; letter-spacing: 0.5px; }
        .footer-cta { display: block; font-size: 14px; margin-bottom: 5px; }
        .footer-brand { font-size: 12px; opacity: 0.7; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading" class="loader"></div>
        <div id="error-msg" style="display:none; color: #ff6b6b; margin-top:50px; font-weight:bold; padding: 20px; line-height: 1.5; background: rgba(20,20,25,0.8); border-radius: 16px; border: 1px solid rgba(255,107,107,0.3);"></div>

        <div id="content">
            <h1 id="shop-name"></h1>
            <p class="sub" id="shop-sub"></p>

            <div class="card">
                <h2>Hızlı Ödeme</h2>
                
                <div class="label">Hesap Sahibi</div>
                <!-- İSİM VE KOPYALAMA İKONUNUN BULUNDUĞU SATIR -->
                <div class="val" style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="owner-name"></span>
                    <i class="fas fa-copy inline-copy-icon" id="copy-name-btn" onclick="copyName()" title="İsmi Kopyala"></i>
                </div>

                <div class="label">IBAN Numarası</div>
                <div class="val" id="iban-no"></div>
                <button class="btn-copy" onclick="copyIban()" id="copy-btn"><i class="fas fa-copy"></i> IBAN'ı Kopyala</button>
            </div>

            <a id="link-web" href="#" target="_blank" class="social-btn btn-web" style="display:none;">
                <i class="fas fa-globe"></i> Web Sitemizi Ziyaret Edin
            </a>
            <a id="link-g" href="#" target="_blank" class="social-btn btn-google" style="display:none;">
                <i class="fab fa-google"></i> Google'da Bizi Puanlayın
            </a>
            <a id="link-i" href="#" target="_blank" class="social-btn btn-ig" style="display:none;">
                <i class="fab fa-instagram"></i> Instagram'da Takip Edin
            </a>
            <a id="link-w" href="#" target="_blank" class="social-btn btn-wp" style="display:none;">
                <i class="fab fa-whatsapp"></i> WhatsApp'tan Ulaşın
            </a>
            <a id="link-m" href="#" target="_blank" class="social-btn btn-mail" style="display:none;">
                <i class="fas fa-envelope"></i> Bize Mail Atın
            </a>

            <div class="footer">
                <a href="https://wa.me/905525714538?text=Merhaba,%20dijital%20kartvizit%20sistemiyle%20ilgileniyorum." target="_blank" class="footer-cta">Bu dijital kartvizitten yaptırmak için tıklayın</a>
                <div class="footer-brand">
                    Powered by <a href="https://wa.me/905525714538?text=Merhaba,%20dijital%20kartvizit%20sistemiyle%20ilgileniyorum." target="_blank">yusufibtw</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = '1vUGlkYvgoTbdJX0OmvMFH4Xwicowq8WfmD5U6LMvghs';
        const urlParams = new URLSearchParams(window.location.search);
        const musteriID = urlParams.get('id');

        async function fetchVeri() {
            if (!musteriID) {
                showError("Lütfen linkin sonuna ?id=berber gibi bir ek yapın.");
                return;
            }

            let sheetId = SHEET_URL;
            if (sheetId.includes('/d/')) {
                sheetId = sheetId.split('/d/')[1].split('/')[0];
            }

            const fetchUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&t=${new Date().getTime()}`;
            
            try {
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error("Sunucu hatası");
                const csvText = await response.text();
                
                if (csvText.trim().startsWith('<!DOCTYPE html>')) {
                    showError("Excel tablosuna ulaşılamıyor. Paylaşım ayarlarını kontrol edin.");
                    return;
                }

                const rows = csvText.split(/\r?\n/).filter(r => r.trim() !== '');
                const headers = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                
                let found = false;
                let availableIds = [];

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                    const currentId = cols[0]; 
                    
                    if (currentId) availableIds.push(currentId);

                    if (currentId && currentId.toLowerCase() === musteriID.toLowerCase()) {
                        found = true;
                        
                        const getVal = (name) => {
                            const index = headers.indexOf(name);
                            return index !== -1 ? cols[index] : '';
                        };

                        document.getElementById('shop-name').innerText = getVal('Dukkan_Adi') || cols[1];
                        document.getElementById('shop-sub').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${getVal('Konum') || cols[2]}`;
                        
                        // İSİM BURAYA ÇEKİLİYOR
                        document.getElementById('owner-name').innerText = getVal('Hesap_Sahibi') || cols[3];
                        document.getElementById('iban-no').innerText = getVal('IBAN') || cols[4];

                        const gl = getVal('Google_Link') || cols[5];
                        const ig = getVal('Insta_Link') || cols[6];
                        const wp = getVal('WP_No') || cols[7];
                        const mail = getVal('Mail_Adresi') || cols[8];
                        const web = getVal('Web_Sitesi') || cols[9];

                        if(web) { document.getElementById('link-web').href = web; document.getElementById('link-web').style.display = 'flex'; }
                        if(gl) { document.getElementById('link-g').href = gl; document.getElementById('link-g').style.display = 'flex'; }
                        if(ig) { document.getElementById('link-i').href = `https://instagram.com/${ig}`; document.getElementById('link-i').style.display = 'flex'; }
                        if(wp) { document.getElementById('link-w').href = `https://wa.me/${wp}`; document.getElementById('link-w').style.display = 'flex'; }
                        if(mail) { document.getElementById('link-m').href = `mailto:${mail}`; document.getElementById('link-m').style.display = 'flex'; }
                        break;
                    }
                }

                if (found) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    showError(`Kayıt Bulunamadı!<br><br>Aranan ID: <b>${musteriID}</b><br>Tabloda Bulunan ID'ler: <b>${availableIds.join(', ')}</b>`);
                }

            } catch (error) {
                showError("Veri çekilemedi. İnternetinizi kontrol edin.");
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const errDiv = document.getElementById('error-msg');
            errDiv.innerHTML = msg;
            errDiv.style.display = 'block';
        }

        // IBAN KOPYALAMA FONKSİYONU
        function copyIban() {
            const text = document.getElementById('iban-no').innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerHTML = '<i class="fas fa-check"></i> Kopyalandı!';
                btn.style.background = '#4CAF50'; 
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i> IBAN\'ı Kopyala';
                    btn.style.background = 'linear-gradient(135deg, #d4af37, #b5952f)'; 
                    btn.style.color = '#000';
                }, 2000);
            });
        }

        // YENİ: İSİM KOPYALAMA FONKSİYONU
        function copyName() {
            const text = document.getElementById('owner-name').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const icon = document.getElementById('copy-name-btn');
                icon.className = 'fas fa-check inline-copy-icon';
                icon.style.color = '#4CAF50';
                setTimeout(() => {
                    icon.className = 'fas fa-copy inline-copy-icon';
                    icon.style.color = 'var(--gold)';
                }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', fetchVeri);
    </script>
</body>
</html>
