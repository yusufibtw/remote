<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Kartvizit</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --gold: #d4af37; --text: #fff; --muted: #a0a0a0; --google-blue: #4285F4; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 30px 20px; box-sizing: border-box; text-align: center; }
        
        .profile-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--gold); margin-top: 10px; object-fit: cover; }
        h1 { font-size: 22px; margin: 15px 0 5px; }
        p.sub { color: var(--muted); font-size: 14px; margin-bottom: 25px; }
        
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .card h2 { color: var(--gold); font-size: 14px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
        .val { font-size: 18px; font-weight: bold; margin-bottom: 15px; word-break: break-all; }
        
        .btn-copy { background: var(--gold); color: black; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s;}
        
        .social-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 16px; border-radius: 10px; margin-bottom: 12px; font-size: 16px; font-weight: bold; color: var(--text); box-sizing: border-box;}
        .social-btn i { font-size: 22px; margin-right: 12px; }
        .btn-google { background-color: var(--google-blue); }
        .btn-wp { background-color: #25D366; color: #000; }
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        
        /* Şık Yükleme Animasyonu */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #content { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading" class="loader"></div>
        <div id="error-msg" style="display:none; color: #ff6b6b; margin-top:50px; font-weight:bold;"></div>

        <div id="content">
            <img id="logo-img" src="" alt="Logo" class="profile-img">
            <h1 id="shop-name"></h1>
            <p class="sub" id="shop-sub"></p>

            <div class="card">
                <h2>Hızlı Ödeme</h2>
                <div class="label">Hesap Sahibi</div>
                <div class="val" id="owner-name"></div>
                <div class="label">IBAN Numarası</div>
                <div class="val" id="iban-no"></div>
                <button class="btn-copy" onclick="copyIban()" id="copy-btn"><i class="fas fa-copy"></i> IBAN'ı Kopyala</button>
            </div>

            <a id="link-g" href="#" target="_blank" class="social-btn btn-google" style="display:none;">
                <i class="fab fa-google"></i> Google'da Bizi Puanlayın
            </a>
            <a id="link-i" href="#" target="_blank" class="social-btn btn-ig" style="display:none;">
                <i class="fab fa-instagram"></i> Instagram'da Takip Edin
            </a>
            <a id="link-w" href="#" target="_blank" class="social-btn btn-wp" style="display:none;">
                <i class="fab fa-whatsapp"></i> WhatsApp'tan Ulaşın
            </a>
        </div>
    </div>

    <script>
        // Senin Excel Tablonun Bağlantı ID'si (Otomatik ekledim, ellemene gerek yok)
        const SHEET_ID = '1vUGlkYvgoTbdJX0OmvMFH4Xwicowq8WfmD5U6LMvghs';

        // Linkten ID'yi okur (Örn: ?id=berber_ahmet)
        const urlParams = new URLSearchParams(window.location.search);
        const musteriID = urlParams.get('id');

        async function fetchVeri() {
            if (!musteriID) {
                showError("Geçersiz link. Lütfen bir dükkan ID'si girin.");
                return;
            }

            // Google Tablolardan veriyi anlık çeken kod
            const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
            
            try {
                const response = await fetch(sheetUrl);
                const csvText = await response.text();
                
                // CSV Ayrıştırma işlemi
                const rows = csvText.split('\n');
                let found = false;

                // 2. satırdan itibaren müşterileri tarar
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].trim() === '') continue;
                    
                    // Hücreleri ayır ve tırnak işaretlerini temizle
                    const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"\vert{}"$/g, '').trim());
                    
                    if (cols[0] === musteriID) {
                        found = true;
                        document.getElementById('shop-name').innerText = cols[1];
                        document.getElementById('shop-sub').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${cols[2]}`;
                        document.getElementById('logo-img').src = `https://ui-avatars.com/api/?name=${cols[3]}&background=d4af37&color=000&size=150`;
                        document.getElementById('owner-name').innerText = cols[4];
                        document.getElementById('iban-no').innerText = cols[5];

                        if(cols[6]) { document.getElementById('link-g').href = cols[6]; document.getElementById('link-g').style.display = 'flex'; }
                        if(cols[7]) { document.getElementById('link-i').href = `https://instagram.com/${cols[7]}`; document.getElementById('link-i').style.display = 'flex'; }
                        if(cols[8]) { document.getElementById('link-w').href = `https://wa.me/${cols[8]}`; document.getElementById('link-w').style.display = 'flex'; }
                        break;
                    }
                }

                if (found) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    showError("Bu dükkana ait kayıt bulunamadı!");
                }

            } catch (error) {
                showError("Sunucuya bağlanılamadı. İnternetinizi kontrol edin.");
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const errDiv = document.getElementById('error-msg');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        function copyIban() {
            const text = document.getElementById('iban-no').innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerHTML = '<i class="fas fa-check"></i> Kopyalandı!';
                btn.style.background = '#4CAF50'; 
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i> IBAN\'ı Kopyala';
                    btn.style.background = 'var(--gold)'; 
                    btn.style.color = '#000';
                }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', fetchVeri);
    </script>
</body>
</html>
