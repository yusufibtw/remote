<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Kartvizit</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0f0f11; --card: rgba(25, 25, 30, 0.5); --gold: #d4af37; --text: #fff; --muted: #a0a0a0; --google-blue: #4285F4; }
        
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; color: var(--text); display: flex; justify-content: center; min-height: 100vh;
            background-color: var(--bg);
            /* Cam efektinin belli olması için arkaya çok hafif ışık süzmeleri eklendi */
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(212, 175, 55, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 85% 100%, rgba(255, 255, 255, 0.04) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        .container { width: 100%; max-width: 480px; padding: 30px 20px; box-sizing: border-box; text-align: center; position: relative; z-index: 1; }
        
        h1 { font-size: 22px; margin: 15px 0 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        p.sub { color: var(--muted); font-size: 14px; margin-bottom: 25px; }
        
        /* GLASSMORPHISM - BUZLU CAM KARTI */
        .card { 
            background: var(--card); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); /* Safari uyumluluğu */
            padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: left; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.4); 
            border: 1px solid rgba(212, 175, 55, 0.15); /* İnce şık altın kenarlık */
        }
        .card h2 { color: var(--gold); font-size: 14px; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .label { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
        .val { font-size: 18px; font-weight: bold; margin-bottom: 15px; word-break: break-all; }
        
        .btn-copy { background: var(--gold); color: black; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);}
        
        .social-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; padding: 16px; border-radius: 10px; margin-bottom: 12px; font-size: 16px; font-weight: bold; color: var(--text); box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
        .social-btn i { font-size: 22px; margin-right: 12px; }
        
        /* Web Butonu da Buzlu Cam Oldu */
        .btn-web { 
            background: rgba(30, 30, 30, 0.4); 
            color: var(--gold); 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .btn-google { background-color: var(--google-blue); }
        .btn-wp { background-color: #25D366; color: #000; }
        .btn-ig { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-mail { background-color: #ea4335; color: #fff; } 
        
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #content { display: none; }

        .footer { margin-top: 25px; text-align: center; font-size: 13px; color: var(--muted); padding-bottom: 15px; line-height: 1.8; }
        .footer a { color: var(--gold); text-decoration: none; font-weight: bold; letter-spacing: 0.5px; }
        .footer-cta { display: block; font-size: 14px; margin-bottom: 5px; }
        .footer-brand { font-size: 11px; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading" class="loader"></div>
        <div id="error-msg" style="display:none; color: #ff6b6b; margin-top:50px; font-weight:bold; padding: 20px; line-height: 1.5; background: rgba(0,0,0,0.8); border-radius: 10px;"></div>

        <div id="content">
            <h1 id="shop-name"></h1>
            <p class="sub" id="shop-sub"></p>

            <div class="card">
                <h2>Hızlı Ödeme</h2>
                <div class="label">Hesap Sahibi</div>
                <div class="val" id="owner-name"></div>
                <div class="label">IBAN Numarası</div>
                <div class="val" id="iban-no"></div>
                <button class="btn-copy" onclick="copyIban()" id="copy-btn"><i class="fas fa-copy"></i> IBAN'ı Kopyala</button>
            </div>

            <a id="link-web" href="#" target="_blank" class="social-btn btn-web" style="display:none;">
                <i class="fas fa-globe"></i> Web Sitemizi Ziyaret Edin
            </a>
            <a id="link-g" href="#" target="_blank" class="social-btn btn-google" style="display:none;">
                <i class="fab fa-google"></i> Google'da Bizi Puanlayın
            </a>
            <a id="link-i" href="#" target="_blank" class="social-btn btn-ig" style="display:none;">
                <i class="fab fa-instagram"></i> Instagram'da Takip Edin
            </a>
            <a id="link-w" href="#" target="_blank" class="social-btn btn-wp" style="display:none;">
                <i class="fab fa-whatsapp"></i> WhatsApp'tan Ulaşın
            </a>
            <a id="link-m" href="#" target="_blank" class="social-btn btn-mail" style="display:none;">
                <i class="fas fa-envelope"></i> Bize Mail Atın
            </a>

            <div class="footer">
                <a href="https://wa.me/905525714538?text=Merhaba,%20dijital%20kartvizit%20sistemiyle%20ilgileniyorum." target="_blank" class="footer-cta">Bu dijital kartvizitten yaptırmak için tıklayın</a>
                <div class="footer-brand">
                    Powered by <a href="https://wa.me/905525714538?text=Merhaba,%20dijital%20kartvizit%20sistemiyle%20ilgileniyorum." target="_blank">yusufibtw</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = '1vUGlkYvgoTbdJX0OmvMFH4Xwicowq8WfmD5U6LMvghs';
        const urlParams = new URLSearchParams(window.location.search);
        const musteriID = urlParams.get('id');

        async function fetchVeri() {
            if (!musteriID) {
                showError("Lütfen linkin sonuna ?id=berber gibi bir ek yapın.");
                return;
            }

            let sheetId = SHEET_URL;
            if (sheetId.includes('/d/')) {
                sheetId = sheetId.split('/d/')[1].split('/')[0];
            }

            const fetchUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&t=${new Date().getTime()}`;
            
            try {
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error("Sunucu hatası");
                const csvText = await response.text();
                
                if (csvText.trim().startsWith('<!DOCTYPE html>')) {
                    showError("Excel tablosuna ulaşılamıyor. Paylaşım ayarlarını kontrol edin.");
                    return;
                }

                const rows = csvText.split(/\r?\n/).filter(r => r.trim() !== '');
                const headers = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                
                let found = false;
                let availableIds = [];

                for (let i = 1; i < rows.length; i++) {
                    const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/"/g, '').trim());
                    const currentId = cols[0]; 
                    
                    if (currentId) availableIds.push(currentId);

                    if (currentId && currentId.toLowerCase() === musteriID.toLowerCase()) {
                        found = true;
                        
                        const getVal = (name) => {
                            const index = headers.indexOf(name);
                            return index !== -1 ? cols[index] : '';
                        };

                        document.getElementById('shop-name').innerText = getVal('Dukkan_Adi') || cols[1];
                        document.getElementById('shop-sub').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${getVal('Konum') || cols[2]}`;
                        
                        document.getElementById('owner-name').innerText = getVal('Hesap_Sahibi') || cols[3];
                        document.getElementById('iban-no').innerText = getVal('IBAN') || cols[4];

                        const gl = getVal('Google_Link') || cols[5];
                        const ig = getVal('Insta_Link') || cols[6];
                        const wp = getVal('WP_No') || cols[7];
                        const mail = getVal('Mail_Adresi') || cols[8];
                        const web = getVal('Web_Sitesi') || cols[9];

                        if(web) { document.getElementById('link-web').href = web; document.getElementById('link-web').style.display = 'flex'; }
                        if(gl) { document.getElementById('link-g').href = gl; document.getElementById('link-g').style.display = 'flex'; }
                        if(ig) { document.getElementById('link-i').href = `https://instagram.com/${ig}`; document.getElementById('link-i').style.display = 'flex'; }
                        if(wp) { document.getElementById('link-w').href = `https://wa.me/${wp}`; document.getElementById('link-w').style.display = 'flex'; }
                        if(mail) { document.getElementById('link-m').href = `mailto:${mail}`; document.getElementById('link-m').style.display = 'flex'; }
                        break;
                    }
                }

                if (found) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    showError(`Kayıt Bulunamadı!<br><br>Aranan ID: <b>${musteriID}</b><br>Tabloda Bulunan ID'ler: <b>${availableIds.join(', ')}</b>`);
                }

            } catch (error) {
                showError("Veri çekilemedi. İnternetinizi kontrol edin.");
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const errDiv = document.getElementById('error-msg');
            errDiv.innerHTML = msg;
            errDiv.style.display = 'block';
        }

        function copyIban() {
            const text = document.getElementById('iban-no').innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerHTML = '<i class="fas fa-check"></i> Kopyalandı!';
                btn.style.background = '#4CAF50'; 
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i> IBAN\'ı Kopyala';
                    btn.style.background = 'var(--gold)'; 
                    btn.style.color = '#000';
                }, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', fetchVeri);
    </script>
</body>
</html>
